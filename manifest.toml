#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "sixteen"
name = "Sixteen"
description.en = "16-cell video wall with a public link for each saved layout"
description.fr = "Mur vidéo de 16 cases, avec un lien public pour chaque mur enregistré"

version = "1.0~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0-or-later"
code = "https://github.com/wearenh/sixteen"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "800M"
ram.build = "1500M"
ram.runtime = "250M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
